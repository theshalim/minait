<!doctype html>
<html lang="{{ lang or 'en' }}" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ site_name }} — Reliable IT Services{% endblock %}</title>
  <meta name="description" content="{% block description %}Fast, dependable IT services — just message us on WhatsApp.{% endblock %}" />
  <!-- Set the theme before first paint, so there's no flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', '"Noto Sans Bengali"', 'ui-sans-serif', 'system-ui'] },
          colors: {
            brand: { DEFAULT: '#14b8a6', dark: '#0f766e', light: '#ecfdf9' },
            // Soft tinted surface for cards (the "bento" look).
            tint: { DEFAULT: '#eef6f5', dark: '#122523' },
          },
        },
      },
    };
  </script>
  <!-- Shared building blocks, so every page (public + admin) looks the same. -->
  <style type="text/tailwindcss">
    @layer components {
      .container-x { @apply max-w-6xl mx-auto px-4 sm:px-6; }
      .eyebrow { @apply text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-500 dark:text-slate-400; }
      .section-title { @apply text-3xl sm:text-4xl font-medium tracking-tight text-slate-900 dark:text-white; }
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium transition whitespace-nowrap disabled:opacity-50; }
      .btn-dark { @apply btn bg-slate-900 text-white hover:bg-slate-700 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200; }
      .btn-brand { @apply btn bg-brand text-white hover:bg-brand-dark shadow-sm shadow-brand/30; }
      .btn-outline { @apply btn border border-slate-300 text-slate-700 hover:border-slate-900 hover:text-slate-900 dark:border-slate-600 dark:text-slate-200 dark:hover:border-white dark:hover:text-white; }
      .btn-ghost { @apply btn px-3 text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white; }
      .btn-danger { @apply btn px-3 text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/40; }
      .btn-sm { @apply px-3.5 py-1.5 text-[13px]; }
      .label { @apply block text-[13px] font-medium text-slate-700 dark:text-slate-300 mb-1.5; }
      .input { @apply w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/10 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100; }
      .hint { @apply text-xs text-slate-400 mt-1.5; }
      .panel { @apply rounded-2xl border border-slate-200/80 bg-white dark:border-slate-800 dark:bg-slate-900; }
      .badge { @apply inline-flex items-center rounded-full px-2.5 py-0.5 text-[11px] font-medium; }
      .badge-green { @apply badge bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400; }
      .badge-amber { @apply badge bg-amber-50 text-amber-700 dark:bg-amber-950/50 dark:text-amber-400; }
      .badge-gray { @apply badge bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400; }
      .alert-ok { @apply rounded-xl bg-emerald-50 px-4 py-3 text-sm text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-400; }
      .alert-err { @apply rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600 dark:bg-red-950/40 dark:text-red-400; }
    }
  </style>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" type="image/png" href="/static/img/logo.png" />
</head>
<body class="min-h-screen bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased flex flex-col transition-colors">

  {% block header %}{% include "partials/navbar.html" %}{% endblock %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}{% include "partials/footer.html" %}{% endblock %}

  {% block assistant %}
  <!-- Floating Assistant (FAQ) widget — hidden until /api/faqs confirms there's
       something to show. See main.js for the fetch/toggle logic. -->
  <button id="assistant-fab" type="button" aria-label="{{ t('assistant.label') }}" hidden
          class="fixed bottom-5 right-5 sm:bottom-6 sm:right-6 z-50 w-14 h-14 rounded-full bg-slate-900 text-white dark:bg-white dark:text-slate-900
                 shadow-[0_12px_30px_-8px_rgba(15,23,42,0.45)] hover:scale-105 active:scale-95 flex items-center justify-center transition">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.2"/><path d="M12 16.5h.01"/></svg>
  </button>

  <div id="assistant-panel" hidden data-empty="{{ t('assistant.empty') }}" data-back="{{ t('assistant.back') }}"
       class="fixed bottom-[5.5rem] right-4 sm:right-6 z-50 w-[calc(100vw-2rem)] max-w-sm
              bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-800 overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 dark:border-slate-800">
      <div>
        <div class="font-semibold">{{ t('assistant.title') }}</div>
        <div class="text-xs text-slate-500 dark:text-slate-400">{{ t('assistant.subtitle') }}</div>
      </div>
      <button id="assistant-close" type="button" aria-label="{{ t('assistant.close') }}"
              class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center transition flex-shrink-0">
        <span class="text-xl leading-none">&times;</span>
      </button>
    </div>
    <div id="assistant-body" class="max-h-96 overflow-y-auto p-2"></div>
  </div>
  {% endblock %}

  <script src="/static/js/main.js"></script>
</body>
</html>
