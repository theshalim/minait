<!doctype html>
<html lang="{{ lang or 'en' }}" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ site_name }} — Reliable IT Services{% endblock %}</title>
  <meta name="description" content="{% block description %}Fast, dependable IT services — ordered online in minutes.{% endblock %}" />
  <!-- Set the theme before first paint, so there's no flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          colors: { brand: { DEFAULT: '#14b8a6', dark: '#0f766e', light: '#ecfdf9' } },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" type="image/png" href="/static/img/logo.png" />
</head>
<body class="min-h-screen bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased flex flex-col transition-colors">

  {% include "partials/navbar.html" %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <!-- Floating Assistant (FAQ) widget — hidden until /api/faqs confirms there's
       something to show. See main.js for the fetch/toggle logic. -->
  <button id="assistant-fab" type="button" aria-label="Assistant" hidden
          class="fixed bottom-6 right-6 z-50 w-16 h-16 rounded-full bg-gradient-to-br from-brand to-brand-dark text-white
                 shadow-[0_10px_30px_-6px_rgba(20,184,166,0.55)] hover:shadow-[0_14px_36px_-6px_rgba(20,184,166,0.65)]
                 hover:scale-105 active:scale-95 flex items-center justify-center transition">
    <span class="text-2xl font-extrabold leading-none">?</span>
  </button>

  <div id="assistant-panel" hidden
       class="fixed bottom-[5.75rem] right-4 sm:right-6 z-50 w-[calc(100vw-2rem)] max-w-sm
              bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800 overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4 bg-gradient-to-br from-brand to-brand-dark text-white">
      <div>
        <div class="font-bold">Ask us anything</div>
        <div class="text-xs text-white/80">Quick answers, no waiting</div>
      </div>
      <button id="assistant-close" type="button" aria-label="Close"
              class="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center transition flex-shrink-0">
        <span class="text-xl leading-none">&times;</span>
      </button>
    </div>
    <div id="assistant-body" class="max-h-96 overflow-y-auto p-2"></div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
