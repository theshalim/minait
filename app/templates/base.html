<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ site_name }} — Reliable IT Services{% endblock %}</title>
  <meta name="description" content="{% block description %}Fast, dependable IT services — ordered online in minutes.{% endblock %}" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          colors: { brand: { DEFAULT: '#14b8a6', dark: '#0f766e', light: '#ecfdf9' } },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" type="image/png" href="/static/img/logo.png" />
</head>
<body class="min-h-screen bg-white text-slate-900 font-sans antialiased flex flex-col">

  {% include "partials/navbar.html" %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="/static/js/main.js"></script>
</body>
</html>
