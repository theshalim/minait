{% extends "base.html" %}
{% block title %}Sign up — {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-5 py-20">
  <h1 class="text-2xl font-extrabold mb-6 text-center">Create your account</h1>

  {% if error %}
  <div class="bg-red-50 text-red-600 text-sm px-4 py-3 rounded-lg mb-5">{{ error }}</div>
  {% endif %}
  {% if message %}
  <div class="bg-green-50 text-green-700 text-sm px-4 py-3 rounded-lg mb-5">{{ message }}</div>
  {% endif %}

  <form method="post" action="/signup" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Full name</label>
      <input required name="full_name" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input required type="email" name="email" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Phone</label>
      <input name="phone" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input required type="password" minlength="6" name="password" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <button type="submit" class="w-full bg-brand text-white py-2.5 rounded-lg font-semibold hover:bg-brand-dark transition">Create account</button>
  </form>
  <p class="text-center text-sm text-slate-500 mt-6">
    Already have an account? <a href="/login" class="text-brand font-semibold">Log in</a>
  </p>
</div>
{% endblock %}
