{% extends "base.html" %}
{% block title %}Sign up — {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-5 py-20">
  <h1 class="text-2xl font-extrabold mb-6 text-center">{{ t('signup.title') }}</h1>

  {% if error %}
  <div class="bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 text-sm px-4 py-3 rounded-lg mb-5">{{ error }}</div>
  {% endif %}
  {% if message %}
  <div class="bg-green-50 dark:bg-green-950/40 text-green-700 dark:text-green-400 text-sm px-4 py-3 rounded-lg mb-5">{{ message }}</div>
  {% endif %}

  <form method="post" action="/signup" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">{{ t('signup.full_name') }}</label>
      <input required name="full_name" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-900 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">{{ t('signup.email') }}</label>
      <input required type="email" name="email" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-900 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">{{ t('signup.phone') }}</label>
      <input name="phone" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-900 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">{{ t('signup.password') }}</label>
      <input required type="password" minlength="6" name="password" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-900 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <button type="submit" class="w-full bg-brand text-white py-2.5 rounded-lg font-semibold hover:bg-brand-dark transition">{{ t('signup.submit') }}</button>
  </form>
  <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
    {{ t('signup.have_account') }} <a href="/login" class="text-brand font-semibold">{{ t('signup.log_in') }}</a>
  </p>
</div>
{% endblock %}
