{% extends "base.html" %}
{% block title %}Log in — {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-5 py-20">
  <h1 class="text-2xl font-extrabold mb-6 text-center">Welcome back</h1>

  {% if error %}
  <div class="bg-red-50 text-red-600 text-sm px-4 py-3 rounded-lg mb-5">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input required type="email" name="email" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input required type="password" name="password" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <button type="submit" class="w-full bg-brand text-white py-2.5 rounded-lg font-semibold hover:bg-brand-dark transition">Log in</button>
  </form>
  <p class="text-center text-sm text-slate-500 mt-6">
    New here? <a href="/signup" class="text-brand font-semibold">Create an account</a>
  </p>
</div>
{% endblock %}
