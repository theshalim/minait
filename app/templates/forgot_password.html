{% extends "base.html" %}
{% block title %}{{ t('forgot.title') }} — {{ site_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-5 py-20">
  <h1 class="text-2xl font-extrabold mb-3 text-center">{{ t('forgot.title') }}</h1>

  {% if sent %}
  <div class="bg-green-50 dark:bg-green-950/40 text-green-700 dark:text-green-400 text-sm px-4 py-3 rounded-lg mb-5">{{ t('forgot.sent') }}</div>
  {% else %}
  <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-6">{{ t('forgot.body') }}</p>
  <form method="post" action="/forgot-password" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">{{ t('forgot.email') }}</label>
      <input required type="email" name="email" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-900 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand/40" />
    </div>
    <button type="submit" class="w-full bg-brand text-white py-2.5 rounded-lg font-semibold hover:bg-brand-dark transition">{{ t('forgot.submit') }}</button>
  </form>
  {% endif %}

  <p class="text-center text-sm mt-6">
    <a href="/login" class="text-brand font-semibold">{{ t('signup.log_in') }}</a>
  </p>
</div>
{% endblock %}
