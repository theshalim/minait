<header class="border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur z-40">
  <div class="max-w-6xl mx-auto px-5 h-20 flex items-center justify-between">
    <a href="/" class="flex items-center">
      <img src="/static/img/logo.png" alt="{{ site_name }}" class="h-14 sm:h-16 w-auto" />
    </a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600 dark:text-slate-300">
      <a href="/#services" class="hover:text-brand">{{ t('nav.services') }}</a>
      <a href="/#how-it-works" class="hover:text-brand">{{ t('nav.how_it_works') }}</a>
      <a href="/blog" class="hover:text-brand">{{ t('nav.blog') }}</a>
    </nav>
    <div class="flex items-center gap-3 text-sm font-semibold">
      <!-- Language switch -->
      <div class="hidden sm:flex items-center gap-1 text-xs font-semibold text-slate-400">
        <a href="/set-lang/en?next={{ request.url.path | urlencode }}"
           class="px-1.5 py-0.5 rounded {{ 'text-brand' if lang == 'en' else 'hover:text-slate-600 dark:hover:text-slate-200' }}">EN</a>
        <span>/</span>
        <a href="/set-lang/bn?next={{ request.url.path | urlencode }}"
           class="px-1.5 py-0.5 rounded {{ 'text-brand' if lang == 'bn' else 'hover:text-slate-600 dark:hover:text-slate-200' }}">বাং</a>
      </div>

      <!-- Theme toggle -->
      <button type="button" id="theme-toggle" aria-label="Toggle dark mode"
              class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <span class="dark:hidden">🌙</span>
        <span class="hidden dark:inline">☀️</span>
      </button>

      {% if user %}
        {% if user.is_admin %}
          <a href="/admin" class="text-slate-600 dark:text-slate-300 hover:text-brand">{{ t('nav.admin') }}</a>
        {% endif %}
        <a href="/dashboard" class="text-slate-600 dark:text-slate-300 hover:text-brand">{{ t('nav.dashboard') }}</a>
        <a href="/logout" class="text-slate-400 hover:text-red-500">{{ t('nav.logout') }}</a>
      {% else %}
        <a href="/login" class="text-slate-600 dark:text-slate-300 hover:text-brand">{{ t('nav.login') }}</a>
        <a href="/signup" class="bg-brand text-white px-4 py-2 rounded-lg hover:bg-brand-dark transition">{{ t('nav.signup') }}</a>
      {% endif %}
    </div>
  </div>
</header>
