<header class="border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur z-40">
  <div class="max-w-6xl mx-auto px-5 h-20 flex items-center justify-between">
    <a href="/" class="flex items-center">
      <img src="/static/img/logo.png" alt="{{ site_name }}" class="h-14 sm:h-16 w-auto" />
    </a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600 dark:text-slate-300">
      <a href="/#services" class="hover:text-brand">{{ t('nav.services') }}</a>
      <a href="/#how-it-works" class="hover:text-brand">{{ t('nav.how_it_works') }}</a>
      <a href="/blog" class="hover:text-brand">{{ t('nav.blog') }}</a>
    </nav>
    <div class="flex items-center gap-2 text-sm font-semibold">
      <!-- Utility pill: language + theme + (if logged in) admin/dashboard/logout -->
      <div class="flex items-center gap-1 p-1 rounded-full bg-slate-50/80 dark:bg-slate-900/60 backdrop-blur border border-slate-200/70 dark:border-slate-700/60 shadow-sm">
        <div class="hidden sm:flex items-center gap-0.5 text-xs font-semibold text-slate-400 px-1">
          <a href="/set-lang/en?next={{ request.url.path | urlencode }}"
             class="px-2 py-1 rounded-full {{ 'bg-white dark:bg-slate-800 text-brand shadow-sm' if lang == 'en' else 'hover:text-slate-600 dark:hover:text-slate-200' }}">EN</a>
          <a href="/set-lang/bn?next={{ request.url.path | urlencode }}"
             class="px-2 py-1 rounded-full {{ 'bg-white dark:bg-slate-800 text-brand shadow-sm' if lang == 'bn' else 'hover:text-slate-600 dark:hover:text-slate-200' }}">বাং</a>
        </div>

        <button type="button" id="theme-toggle" aria-label="Toggle dark mode"
                class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 transition">
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>

        {% if user %}
          {% if user.is_admin %}
            <a href="/admin" class="px-3 py-2 rounded-full text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 hover:text-brand transition">{{ t('nav.admin') }}</a>
          {% endif %}
          <a href="/dashboard" class="px-3 py-2 rounded-full text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 hover:text-brand transition">{{ t('nav.dashboard') }}</a>
          <a href="/logout" class="px-3 py-2 rounded-full text-slate-400 hover:bg-white dark:hover:bg-slate-800 hover:text-red-500 transition">{{ t('nav.logout') }}</a>
        {% else %}
          <a href="/login" class="px-3 py-2 rounded-full text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 hover:text-brand transition">{{ t('nav.login') }}</a>
        {% endif %}
      </div>

      {% if not user %}
      <a href="/signup" class="bg-brand text-white px-5 py-2.5 rounded-full hover:bg-brand-dark shadow-md shadow-brand/25 transition">{{ t('nav.signup') }}</a>
      {% endif %}
    </div>
  </div>
</header>
