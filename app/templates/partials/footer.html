<footer class="border-t border-slate-100 mt-20">
  <div class="max-w-6xl mx-auto px-5 py-12 grid gap-8 sm:grid-cols-3 text-sm">
    <div>
      <div class="font-extrabold text-lg mb-2">{{ site_name }}</div>
      <p class="text-slate-500">Straightforward IT services, ordered online in minutes.</p>
    </div>
    <div>
      <div class="font-semibold mb-2 text-slate-800">Explore</div>
      <ul class="space-y-1 text-slate-500">
        <li><a href="/#services" class="hover:text-brand">Services</a></li>
        <li><a href="/blog" class="hover:text-brand">Blog</a></li>
        <li><a href="/#how-it-works" class="hover:text-brand">How it works</a></li>
      </ul>
    </div>
    <div>
      <div class="font-semibold mb-2 text-slate-800">Talk to us</div>
      {% if whatsapp_number %}
      <a href="https://wa.me/{{ whatsapp_number }}" target="_blank" rel="noopener"
         class="inline-flex items-center gap-2 text-green-600 hover:text-green-700 font-medium">
        💬 Chat on WhatsApp
      </a>
      {% endif %}
    </div>
  </div>
  <div class="text-center text-xs text-slate-400 pb-8">© {{ site_name }}. All rights reserved.</div>
</footer>
